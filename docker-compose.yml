version: '3.8'

services:
  megaeatermmoapi:
    build:
      context: ./MegaEaterMMO.API
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ConnectionStrings__Postgres=Host=db;Port=5432;Database=megaeater;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=valkey:6379
      - ConnectionStrings__RabbitMQ=amqp://user:password@rabbitmq:5672/
      - Neo4j__Uri=bolt://neo4j:7687
      - Neo4j__Username=neo4j
      - Neo4j__Password=password

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: megaeater
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: docker.io/bitnami/valkey:latest
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - '6379:6379'
    volumes:
      - 'valkey_data:/bitnami/valkey/data'

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - 'rabbitmq_data:/var/lib/rabbitmq'

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
     - 'neo4j_data:/data'

volumes:
  postgres_data:
  valkey_data:
    driver: local  
  neo4j_data:
  rabbitmq_data:
  
  