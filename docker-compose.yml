version: '3.8'

services:
  megaeatermmoapi:
    build:
      context: ./MegaEaterMMO.API
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ConnectionStrings__Default=Host=db;Port=5432;Database=megaeater;Username=postgres;Password=postgres
      - Redis__Configuration=valkey:6379

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: megaeater
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: docker.io/bitnami/valkey:latest
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - '6379:6379'
    volumes:
      - 'valkey_data:/bitnami/valkey/data'

volumes:
  postgres_data:
  valkey_data:
    driver: local  